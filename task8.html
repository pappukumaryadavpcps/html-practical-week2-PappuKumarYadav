<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Midea hub</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <style>
      h1 {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>My Media Hub</h1>

    <!-- YouTube Video -->
    <h2>YouTube Video</h2>

    
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/lWt4fnK9MIo"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <!-- Local Video -->
    <h2>My Local Video</h2>

    <video width="560" height="315" controls>
      <source src="media/clip.mp4" type="video/mp4" />
      

      Your browser does not support the video element.
    </video>

    <!-- Audio -->
    <h2>My Audio</h2>

    <audio controls>
      <source src="audio/clip.mp3" type="audio/mp3" />

      Your browser does not support the audio element.
    </audio>

    <!-- Google Map -->
    <h2>PCPS College Location</h2>

    <iframe
      src="https://www.google.com/maps?q=PCPS%20College%20Kupondole&output=embed"
      width="600"
      height="450"
      style="border: 0"
      loading="lazy"
    >
    </iframe>

    <!-- External Webpage -->
    <h2>External Webpage</h2>

    <iframe
      src="https://www.wikipedia.org/"
      width="600"
      height="400"
      title="External webpage"
    >
    </iframe>

    <!-- PDF -->
    <h2>My PDF Document</h2>

    <embed src="docs/sample.pdf"application/pdf" width="600" height="500" />
  </body>
</html>
